name: Copilot gateway tests

on:
  pull_request:
    paths:
      - "integrations/github-copilot/**"
      - ".github/workflows/copilot-gateway-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test authentication and gateway lifecycle
        run: python3 -B -m unittest discover -s integrations/github-copilot/tests -v
      - name: Install gateway dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/copilot-gateway-venv"
          "$RUNNER_TEMP/copilot-gateway-venv/bin/python" -m pip install -r integrations/github-copilot/requirements.txt
      - name: Smoke test the authenticated Messages gateway without an account
        run: '"$RUNNER_TEMP/copilot-gateway-venv/bin/python" -B integrations/github-copilot/tests/proxy_smoke.py'
      - name: Test native and translated Copilot tool-call protocols
        run: '"$RUNNER_TEMP/copilot-gateway-venv/bin/python" -B integrations/github-copilot/tests/protocol_smoke.py'
